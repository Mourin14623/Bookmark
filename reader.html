<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173b2b"><title>Reader — Bookmark</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="library.css"><style>body{background:#e9ece5}.reader-main{padding:18px 3% 24px}.reader-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px 18px;margin-bottom:15px}.back{border:0;background:#e8efe2;color:var(--forest);border-radius:8px;padding:10px 13px;font-weight:700;font-size:12px;cursor:pointer}.reader-title{font:600 18px 'Playfair Display',serif;flex:1;min-width:160px}.reader-author{font-size:11px;color:var(--muted);margin-top:3px}.reader-controls{display:flex;gap:7px;flex-wrap:wrap}.reader-controls button{background:var(--forest);color:white;border:0;border-radius:8px;padding:9px 12px;font-size:11px;cursor:pointer}.reader-frame-wrap{background:#fff;border:1px solid #d9dfd6;border-radius:13px;overflow:hidden;height:calc(100vh - 150px);min-height:500px}.reader-frame{width:100%;height:100%;border:0;background:#fff}.reader-brand{display:flex;align-items:center;gap:8px;font:600 17px 'Playfair Display',serif;color:var(--forest)}@media(max-width:600px){.reader-main{padding:10px}.reader-frame-wrap{height:calc(100vh - 190px);min-height:400px}.reader-top{padding:10px}.reader-title{font-size:15px}}</style></head><body><main class="reader-main"><header class="reader-top"><button class="back" onclick="history.back()">← Back</button><div class="reader-title"><div id="bookTitle">Loading book…</div><div class="reader-author" id="bookAuthor"></div></div><div class="reader-controls"><button onclick="document.getElementById('pdfFrame').src=document.getElementById('pdfFrame').src">↻ Reload</button><button onclick="window.location.href='browse.html'">Library</button></div></header><div class="reader-frame-wrap"><iframe class="reader-frame" id="pdfFrame" title="Book reader" allow="fullscreen"></iframe></div></main><script src="app.js"></script><script>const id=Number(new URLSearchParams(location.search).get('book'));const b=books.find(x=>x.id===id);if(!b){document.getElementById('bookTitle').textContent='Book not found';document.getElementById('pdfFrame').remove()}else{document.title=b.title+' — Bookmark Reader';document.getElementById('bookTitle').textContent=b.title;document.getElementById('bookAuthor').textContent=b.author;const url='https://raw.githubusercontent.com/Mourin14623/Bookmark/main/'+encodeURIComponent(b.path).replace(/%2F/g,'/');document.getElementById('pdfFrame').src=url}</script></body></html>
