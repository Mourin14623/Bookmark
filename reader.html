<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173b2b"><title>Bookmark Reader</title><link rel="stylesheet" href="library.css"><style>
body{margin:0;background:#e9ece5}.reader{min-height:100vh;display:flex;flex-direction:column}.toolbar{position:sticky;top:0;z-index:5;background:#173b2b;color:#fff;display:flex;align-items:center;gap:10px;padding:12px 16px;flex-wrap:wrap;box-shadow:0 4px 16px #0002}.toolbar button{border:0;border-radius:8px;background:#d8e9b4;color:#173b2b;padding:9px 12px;font-weight:700;cursor:pointer}.titleblock{min-width:180px;flex:1}.titleblock strong{font:600 17px 'Playfair Display',serif;display:block}.titleblock small{opacity:.75;font-size:11px}.controls{display:flex;align-items:center;gap:6px}.controls button{padding:8px 10px}.controls span{font-size:12px;min-width:65px;text-align:center}.stage{flex:1;overflow:auto;padding:24px;display:flex;flex-direction:column;align-items:center;gap:18px}.page{background:white;box-shadow:0 4px 22px #0002;max-width:100%;margin:0 auto}.page canvas{display:block;max-width:100%;height:auto}.page{transform-origin:left center;perspective:1400px;backface-visibility:hidden}.page.flip-next{animation:flipNext .42s ease-in forwards}.page.flip-prev{animation:flipPrev .42s ease-in forwards}@keyframes flipNext{0%{transform:rotateY(0);opacity:1}45%{transform:rotateY(-55deg);opacity:.92}100%{transform:rotateY(-105deg);opacity:0}}@keyframes flipPrev{0%{transform:rotateY(0);opacity:1}45%{transform:rotateY(55deg);opacity:.92}100%{transform:rotateY(105deg);opacity:0}}.status{padding:24px;text-align:center;color:#54645a;font-size:13px}.error{color:#a33434;background:#fff;border-radius:12px;padding:20px;max-width:650px}.reader-bottom{padding:10px;text-align:center;font-size:10px;color:#718077}@media(max-width:600px){.toolbar{padding:9px}.titleblock strong{font-size:14px}.stage{padding:10px}.controls{gap:4px}.controls button{padding:7px 8px}}
</style></head><body><div class="reader"><header class="toolbar"><button onclick="location.href='browse.html'">← Library</button><div class="titleblock"><strong id="bookTitle">Loading book…</strong><small id="bookAuthor">Bookmark Reader</small></div><div class="controls"><button id="prev" title="Previous page">←</button><span id="pageLabel">— / —</span><button id="next" title="Next page">→</button><button id="zoomOut">−</button><span id="zoomLabel">100%</span><button id="zoomIn">+</button></div></header><main class="stage" id="stage"><div class="status" id="status">Loading your book…</div></main><footer class="reader-bottom">Bookmark · In-site PDF reader</footer></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script src="app.js"></script>
<script>
(async()=>{
const id=Number(new URLSearchParams(location.search).get('book'));
const book=books.find(x=>x.id===id),stage=document.getElementById('stage'),status=document.getElementById('status');
if(!book){status.textContent='Book not found. Return to Browse Library and select a book.';return}
document.title=book.title+' — Bookmark Reader';document.getElementById('bookTitle').textContent=book.title;document.getElementById('bookAuthor').textContent=book.author;
if(!window.pdfjsLib){status.textContent='The PDF reading engine could not load. Check your internet connection and refresh.';return}
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const pdfURL='./'+encodeURIComponent(book.path).replace(/%2F/g,'/');
let pdf=null,page=1,scale=1.15;
const pageLabel=document.getElementById('pageLabel'),zoomLabel=document.getElementById('zoomLabel');
function updateControls(){pageLabel.textContent=page+' / '+(pdf?pdf.numPages:'—');zoomLabel.textContent=Math.round(scale*100)+'%';document.getElementById('prev').disabled=page<=1;document.getElementById('next').disabled=!pdf||page>=pdf.numPages}
async function render(){if(!pdf)return;status.style.display='none';stage.querySelectorAll('.page').forEach(n=>n.remove());const p=await pdf.getPage(page);const viewport=p.getViewport({scale});const div=document.createElement('div');div.className='page';const canvas=document.createElement('canvas');const ctx=canvas.getContext('2d');const dpr=window.devicePixelRatio||1;canvas.width=Math.floor(viewport.width*dpr);canvas.height=Math.floor(viewport.height*dpr);canvas.style.width=viewport.width+'px';canvas.style.height=viewport.height+'px';div.append(canvas);stage.append(div);await p.render({canvasContext:ctx,viewport,transform:dpr!==1?[dpr,0,0,dpr,0,0]:null}).promise;updateControls();stage.scrollTo({top:0,behavior:'smooth'})}
try{pdf=await pdfjsLib.getDocument({url:pdfURL}).promise;status.style.display='none';page=1;await render()}catch(e){status.style.display='block';status.innerHTML='<div class="error"><strong>Could not load this PDF.</strong><p>'+String(e.message||e)+'</p><p>Check that the file is in the repository and GitHub Pages has finished publishing.</p><button onclick="location.href=\'browse.html\'">Return to Library</button></div>';return}
async function flip(direction){if(!pdf)return;const target=direction==='next'?page+1:page-1;if(target<1||target>pdf.numPages)return;const old=stage.querySelector('.page');if(old){old.classList.add(direction==='next'?'flip-next':'flip-prev');await new Promise(resolve=>setTimeout(resolve,420))}page=target;await render()}document.getElementById('prev').onclick=()=>flip('prev');document.getElementById('next').onclick=()=>flip('next');document.getElementById('zoomIn').onclick=()=>{scale=Math.min(2.5,scale+.15);render()};document.getElementById('zoomOut').onclick=()=>{scale=Math.max(.5,scale-.15);render()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&page<pdf.numPages){flip('next')}if(e.key==='ArrowLeft'&&page>1){flip('prev')}});
})();
</script></body></html>
